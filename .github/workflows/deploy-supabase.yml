name: Supabase Edge Functions をデプロイ

# supabase/functions 以下を変更したら、GitHub が自動でデプロイする。
# 手元に Supabase CLI を入れなくても関数を更新できる。
#
# 事前に GitHub の Settings → Secrets and variables → Actions で以下を登録しておくこと:
#   SUPABASE_ACCESS_TOKEN … https://supabase.com/dashboard/account/tokens で発行
#   SUPABASE_PROJECT_ID  … プロジェクトの Reference ID（Project Settings → General）
#
# JWT検証の要否は supabase/config.toml の [functions.*] に書いてあるため、
# ここでは関数名を個別に指定しない（指定漏れで一部だけ古いままになるのを防ぐ）。
on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

concurrency:
  group: deploy-supabase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: コードを取得
        uses: actions/checkout@v4

      - name: Supabase CLI を用意
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Edge Functions をデプロイ
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
