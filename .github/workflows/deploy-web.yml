name: Deploy Web (EAS Hosting)

# main が更新されたら、GitHub が自動で Web 版を書き出して本番公開する。
#
# 本番へ出すのは main だけにしている。以前は claude/** への push でも
# --prod でデプロイしていたため、作業中のブランチが本番を上書きしてしまい、
# 「main にマージしたのに古い画面が出る」という事故が起きていた。
# 作業ブランチはプレビュー（本番とは別のURL）へ出す。
on:
  push:
    branches:
      - main
      - 'claude/**'
    # 中身に関係ないファイルだけの変更ではデプロイしない
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

# 同じブランチで連続 push したときは、古い実行を止めて最新だけ動かす
concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: コードを取得
        uses: actions/checkout@v4

      - name: Node.js を用意
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 依存をインストール
        run: npm ci

      # EXPO_PUBLIC_ の値はここでバンドルに埋め込まれる。未設定なら
      # アプリはログイン不要の「ローカル専用モード」で動く（起動はする）。
      # 有効にするには GitHub の Settings > Secrets に3つを登録する。
      # --clear は必須。Metro の変換キャッシュが残っていると、
      # process.env.EXPO_PUBLIC_* が undefined のまま埋め込まれた結果を
      # 使い回してしまい、鍵を設定してもローカル専用モードで公開される。
      - name: Web 版を書き出す
        run: npx expo export --platform web --clear
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY }}

      # ホーム画面に追加したときにロゴが出るよう、apple-touch-icon 等を注入する
      - name: ホーム画面アイコンの設定を注入
        run: node scripts/inject-web-icons.mjs

      # main のときだけ本番URLを差し替える
      - name: 本番へデプロイ（EAS Hosting）
        if: github.ref == 'refs/heads/main'
        run: npx eas-cli@latest deploy --prod --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # 作業ブランチはプレビューURLへ。本番は上書きしない
      - name: プレビューへデプロイ（作業ブランチ）
        if: github.ref != 'refs/heads/main'
        run: npx eas-cli@latest deploy --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
